name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python-test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (locked)
        run: uv sync --locked --python 3.12

      - name: Run pytest
        run: uv run pytest

      - name: Build package (dry-run artifact check)
        run: uv build

      - name: Check setup guidance ships in the wheel
        shell: bash
        run: uv run --isolated --no-project --python 3.12 --with "$(ls dist/*.whl)" python -c "from tf3companion.agent_experience import load_setup_guide, setup_check; assert load_setup_guide().strip() and setup_check().strip()"
