name: Release (draft)

# Builds the release artifacts for a tag and attaches them to a DRAFT release. It never publishes to PyPI or
# to the in-game mod hub: publishing is a manual decision (CONTRIBUTING.md, docs/first-push.md).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install Lua 5.4 (provides luac)
        uses: leafo/gh-actions-lua@32909a2dea0a48c433aec79e7fcd31b4cd55800f # v13.1.0
        with:
          luaVersion: "5.4"

      - name: Install dependencies (locked)
        run: uv sync --locked --python 3.12

      # Fails before anything is built when the tag does not match the package version.
      - name: Check the tag matches the package version
        run: uv run python scripts/release_assets.py check-tag "$GITHUB_REF_NAME"

      - name: Repository guards
        run: uv run python scripts/check_repo.py

      - name: Run the fast test suite
        run: uv run pytest -m "not slow" -q

      - name: Build the wheel and sdist
        run: uv build

      - name: Pack the bridge mod
        run: uv run python scripts/release_assets.py bridge-zip --out dist

      - name: Upload the artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: dist/*
          if-no-files-found: error

  draft-release:
    name: Create the draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: dist

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --draft
          --title "TF3 Companion $GITHUB_REF_NAME"
          --generate-notes
