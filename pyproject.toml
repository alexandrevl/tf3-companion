[project]
name = "tf3-companion"
version = "0.1.0"
description = "Unofficial read-only Transport Fever 3 data analyst with an MCP interface."
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Alexandre Lima", email = "alexandrevl@gmail.com"}]
license = "MIT"
dependencies = [
    "mcp>=1.10",
    "openpyxl>=3.1.5",
    "platformdirs>=4",
]

[project.scripts]
tf3c = "tf3companion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tf3companion"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
