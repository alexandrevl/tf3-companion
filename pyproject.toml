[project]
name = "tf3-companion"
version = "0.1.0"
description = "Unofficial read-only Transport Fever 3 data analyst with an MCP interface."
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Alexandre Lima", email = "alexandrevl@gmail.com"}]
license = "MIT"
keywords = ["transport-fever", "transport-fever-3", "mcp", "analytics", "game-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Simulation",
]
dependencies = [
    "mcp>=2.0.0,<3",
    "openpyxl>=3.1.5",
    "platformdirs>=4",
]

[project.urls]
Homepage = "https://github.com/alexandrevl/tf3-companion"
Repository = "https://github.com/alexandrevl/tf3-companion"
Issues = "https://github.com/alexandrevl/tf3-companion/issues"
Changelog = "https://github.com/alexandrevl/tf3-companion/blob/main/CHANGELOG.md"
Security = "https://github.com/alexandrevl/tf3-companion/security/policy"

[project.scripts]
tf3c = "tf3companion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tf3companion"]

[tool.hatch.build.targets.wheel.force-include]
"mod/tf3_companion_bridge" = "tf3companion/_mod/tf3_companion_bridge"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: builds and installs the wheel in a clean environment; excluded from the commit hook, always run in CI",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
# B905: every zip() pairs equal-length sequences built together; `strict=` would add noise, not safety.
# B008: the default arguments are frozen dataclass instances (thresholds) and are never mutated.
ignore = ["B905", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["tf3companion"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "lupa>=2.0",
    "pillow>=13.0.0",
    "jsonschema>=4.26.0",
    "ruff>=0.17.2",
    "pre-commit>=4.7.0",
]
